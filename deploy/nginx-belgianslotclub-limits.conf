# Limite uniquement les écritures (clé vide = pas de quota sur GET)
map $request_method $bsc_write_key {
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    DELETE  $binary_remote_addr;
    default "";
}
limit_req_zone $bsc_write_key zone=bsc_writes:10m rate=12r/m;
limit_req_status 429;
