# Proxy + headers partagés (origine derrière Cloudflare)
# Installé vers : /etc/nginx/snippets/belgianslotclub-proxy.conf

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# Headers de sécurité (visibles aussi via Cloudflare)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

location /css/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

location /js/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

location /images/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

location /docs/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

# ICS : jamais de cache (Cloudflare cache les .ics par défaut)
location ^~ /calendrier {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Photos marketplace : fichiers, pas Java
location ^~ /marketplace/photo/ {
    alias /home/raspserver/belgianslotclub/uploads/marketplace/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /forum/attachment/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
}

location /forum {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 60s;
    client_max_body_size 40M;
    limit_req zone=bsc_writes burst=6 nodelay;
}

location /marketplace {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 60s;
    client_max_body_size 40M;
    limit_req zone=bsc_writes burst=6 nodelay;
}

location /upload {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 120s;
    client_max_body_size 40M;
    limit_req zone=bsc_writes burst=4 nodelay;
}

location /.well-known/ {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
}

location / {
    include /etc/nginx/snippets/belgianslotclub-proxy-params.conf;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 120s;
}
