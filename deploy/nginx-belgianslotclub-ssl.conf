# Belgian Slot Club — HTTPS Origin (Cloudflare Full / Full strict)
# Activé uniquement si les certificats Origin existent.
# Générés via : SSL/TLS → Origin Server → Create Certificate dans Cloudflare
# ou : ./deploy/harden-cloudflare.sh (affiche la procédure)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name belgianslotclub.com www.belgianslotclub.com;

    ssl_certificate     /etc/ssl/cloudflare/belgianslotclub.pem;
    ssl_certificate_key /etc/ssl/cloudflare/belgianslotclub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 40M;

    # www → apex
    if ($host = www.belgianslotclub.com) {
        return 301 https://belgianslotclub.com$request_uri;
    }

    # HSTS désactivé (Orange Serenity + HSTS = blocage Chrome sans contournement)

    include /etc/nginx/snippets/belgianslotclub-proxy.conf;
}
