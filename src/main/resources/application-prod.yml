server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 24
      min-spare: 4
    accept-count: 50
    max-connections: 100
    connection-timeout: 60s
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024

spring:
  datasource:
    url: jdbc:h2:file:./data/belgianslotclub;DB_CLOSE_ON_EXIT=TRUE;FILE_LOCK=FILE;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 30000

  h2:
    console:
      enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 40MB

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      enabled: true

app:
  share:
    public-base-url: https://belgianslotclub.com
  import:
    password: "Test1234="

logging:
  level:
    root: WARN
    org.example.belgianslotclubspring: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
